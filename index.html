<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作证照片采集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #f5f7fa;
            padding: 24px;
            max-width: 700px;
            margin: 0 auto;
        }
        .container {
            background: #ffffff;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #222;
        }
        .tip-text {
            color:#555;
            margin-bottom:16px;
            text-align:center;
        }
        video {
            width:100%;
            border-radius:8px;
            background:#000;
            display:block;
        }
        canvas {
            display: none;
        }
        .btn-group {
            margin-top:20px;
            text-align:center;
        }
        button {
            padding:12px 24px;
            font-size:16px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
            margin:0 8px;
        }
        button:disabled {
            background:#94a3b8;
            cursor:not-allowed;
        }
        .preview-box {
            margin-top:24px;
        }
        .preview-box img {
            max-width:100%;
            border-radius:8px;
        }
        .error {
            color:#dc2626;
            text-align:center;
            margin-top:12px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>工作证人像采集</h2>
    <p class="tip-text">请点击下方按钮，允许摄像头权限，系统将自动拍摄人像</p>

    <div class="btn-group">
        <button id="startBtn">开始采集</button>
        <a id="downloadLink" style="display:none;"><button>下载照片</button></a>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="error" id="errorMsg"></div>
    <div class="preview-box" id="previewWrap" style="display:none;">
        <h3>拍摄预览</h3>
        <img id="previewImg"/>
    </div>
</div>

<script>
const video = document.querySelector('#video');
const canvas = document.querySelector('#canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.querySelector('#startBtn');
const errorMsg = document.querySelector('#errorMsg');
const previewWrap = document.querySelector('#previewWrap');
const previewImg = document.querySelector('#previewImg');
const downloadLink = document.querySelector('#downloadLink');

let stream = null;

// 用户点击按钮：触发权限申请，授权成功后自动拍照
startBtn.addEventListener('click', async ()=>{
    errorMsg.textContent = '';
    startBtn.disabled = true;
    try {
        // 请求前置摄像头
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width:{ideal:1280},
                height:{ideal:720}
            }
        });
        video.srcObject = stream;

        // 等待视频流就绪，自动拍照，不需要再点拍照键
        video.onloadedmetadata = ()=>{
            setTimeout(()=>{
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video,0,0);

                // 获取图片base64
                const imgDataUrl = canvas.toDataURL("image/jpeg", 0.92);
                previewImg.src = imgDataUrl;
                previewWrap.style.display = 'block';

                // 设置下载链接
                downloadLink.href = imgDataUrl;
                downloadLink.download = "工作证人像.jpg";
                downloadLink.style.display = 'inline-block';

                // 关闭摄像头
                stream.getTracks().forEach(t=>t.stop());
                video.srcObject = null;
            }, 800);
        }

    } catch (err) {
        errorMsg.textContent = "获取摄像头失败：" + err.message;
        startBtn.disabled = false;
        console.error(err);
    }
})

// 页面离开释放摄像头
window.addEventListener('beforeunload', ()=>{
    if(stream) stream.getTracks().forEach(t=>t.stop());
})
</script>
</body>
</html>
